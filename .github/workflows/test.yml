# Runs the tests in tests/ on every pull request (and on master after a merge).
# A pull request also checks that CACHE_VERSION in service-worker.js was bumped when app files changed.
name: tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the CACHE_VERSION check compares with the pull request's base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: node run.mjs
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Upload screenshots and downloads
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out/
          retention-days: 7
